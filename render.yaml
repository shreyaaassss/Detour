# Render blueprint: the DeTour server. Deploy with New > Blueprint, pointing at this repository.
services:
  - type: web
    name: detour-api
    runtime: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false         # set in the Render dashboard, never in this file. Without it the rule reader works alone.
      - key: DETOUR_CALLS
        value: "off"
